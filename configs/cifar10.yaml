# ── Dataset ───────────────────────────────────────────────────────────────────
dataset: CIFAR10        # "CIFAR10" | "CIFAR100"
data_root: ./data

# Checkpoints — override via CLI when running on Colab with Google Drive:
#   python train.py --config configs/cifar10.yaml \
#                   --checkpoint-dir /content/drive/MyDrive/master_thesis/checkpoints
checkpoint_dir: ./checkpoints

# ── Training hyper-parameters ─────────────────────────────────────────────────
batch_size: 128
num_epochs: 100
lr: 0.1
momentum: 0.9
weight_decay: 5.0e-4
lr_milestones: [50, 75]
lr_gamma: 0.1
seed: 42

# ── Unlearning ────────────────────────────────────────────────────────────────
# forget_strategy: "random"  → forget a random fraction of train set
#                  "class"   → forget all samples of a given class
forget_strategy: random
forget_fraction: 0.01   # fraction of train set  (active when strategy=random)
forget_class: 0         # class index to forget   (active when strategy=class)

# ── SISA parameters ──────────────────────────────────────────────────────────
sisa_shards: 5          # number of disjoint data shards (S)
sisa_slices: 10         # number of sequential slices per shard (R)
sisa_aggregation: soft_vote   # "soft_vote" | "majority_vote"

# ── OvR (One-vs-Rest ensemble) Unlearning ────────────────────────────────────
# One dedicated BINARY classifier per class ("class i vs. the rest"). A class's
# POSITIVE influence lives in exactly one sub-model → class-wise unlearning can be
# a single model DROP (O(1)). Its NEGATIVE influence is diffuse (it was a negative
# in every other sub-model) → measured/optionally retrained. See OVR_implementation_reference.md.
ovr_neg_ratio: 2.0       # |negatives| / |positives| per sub-model (balanced batches used)
ovr_slices: 1            # R: SISA-style slices per sub-model (1 = no slicing). Set 5 to match SISA.
ovr_epochs:              # null → use num_epochs. Binary task is easier; fewer epochs often suffice.
ovr_variant:             # null → auto: "drop" (class strategy) | "slice_resume" (random strategy)
                         #   "drop"            — class-wise: deactivate f_k, no retraining (approximate)
                         #   "drop_neg_retrain"— class-wise: drop f_k AND retrain survivors w/o class-k negatives (exact-within-arch)
                         #   "slice_resume"    — sample-wise: retrain affected sub-models without forget samples

# ── ∇τ Gradient-based Unlearning ─────────────────────────────────────────────
# Paper: arxiv.org/abs/2403.14339 — Trippa et al., 2024
#
# Loss: L = α·ReLU(τ − L_Df)² + (1−α)·L_Dr
#   L_Df  = batch loss on forget set  (must use eval transforms, not augmented)
#   L_Dr  = batch loss on retain set
#   τ     = target loss — computed on the TEST SET (not retain training data).
#           Using retain data gives τ ≈ L_Df ≈ very small → ReLU dead → no unlearning.
#           Test-set loss is always higher than training loss, so ReLU fires consistently.
#   α     = balance weight, linearly decayed to 0 over all steps
#
# Rule of thumb (paper §6.4): α_init ≈ (5/3) × |D_f|/|D_train|
# Leave grad_tau_alpha unset (null) to auto-compute from forget_fraction.
grad_tau_forget_epochs: 10       # ~1/10 of pre-training epochs
grad_tau_alpha:                  # null → auto: (5/3) × forget_fraction
grad_tau_lr: 1.0e-4
grad_tau_weight_decay: 1.0e-4
grad_tau_recompute_val_every: 1  # recompute τ every N forget-epochs
